<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#211914">
    <title>Members | CINEFLIX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navbar"></div>
    <main class="users-page">
        <p class="eyebrow">The house list</p>
        <h1>Members</h1>
        <p class="page-intro">A look at the people who have taken their seats.</p>
        <div class="table-container">
            <table class="table">
                <caption class="visually-hidden">Registered CINEFLIX members</caption>
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Name</th>
                        <th scope="col">Email</th>
                        <th scope="col">Age</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>
    <div class="footer"></div>
    <script src="index.js"></script>
</body>
</html>
