<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        box-sizing: border-box;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: Arial, sans-serif;
        background-color: #f5f6f8;
    }

    .modal {
        display: flex;
        flex-direction: column;
        gap: 15px;
        padding: 30px;
        border-radius: 12px;
        background-color: white;
        width: 300px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
    }

    .modal h2 { margin: 0; color: #263238; }
    .modal p { margin: 0; color: #68737c; }

    .modal input {
        width: 100%;
        height: 40px;
        padding: 0 10px;
        box-sizing: border-box;
        border: 1px solid #cfd8dc;
        border-radius: 6px;
    }

    .modal button {
        width: 100%;
        height: 38px;
        background-color: #d84a5d;
        color: white;
        border-radius: 7px;
        border: none;
        cursor: pointer;
    }
    .modal button:hover { background-color: #b9384a; }

    .popup {
        display: flex;
        justify-content: center;
        align-items: center;
        flex: 1;
        min-height: 540px;
        background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)), url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1600&auto=format&fit=crop") center/cover;
    }
</style>
<body>
    <div id="navbar"></div>
    <div class="popup">
        <div class="modal">
            <h2>Create account</h2>
            <p>Create your new account</p>
            <input id="name" type="text" placeholder="name">
            <input id="email" type="text" placeholder="email">
            <input id="password" type="password" placeholder="password">
            <input id="age" type="text" placeholder="age">
            <button class="submit">Register</button>
        </div>
    </div>
    <div class="footer"></div>
    <script src="index.js"></script>
</body>
</html>
