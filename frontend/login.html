<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
        }

        .popup {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            min-height: 500px;
            background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)), url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1600&auto=format&fit=crop") center/cover;
        }

        .modal {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px 30px;
            border-radius: 10px;
            background-color: white;
            width: 300px;
            padding: 30px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
        }

        .modal h2 { margin: 0; color: #263238; }
        .modal p { margin: 0; color: #68737c; }

        .modal input {
            height: 35px;
            padding: 0 10px;
            border: 1px solid #cfd8dc;
            border-radius: 6px;
        }

        .modal button {
            height: 35px;
            background-color: #d84a5d;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .modal button:hover { background-color: #b9384a; }
    </style>
</head>
<body>
    <div id="navbar"></div>

    <div class="popup">
        <div class="modal">
            <h2>Welcome back</h2>
            <p>Log in to your account</p>
            <input id="loginName" type="text" placeholder="name">
            <input id="loginPassword" type="password" placeholder="password">
            <button class="login-btn">Login</button>
        </div>
    </div>

    <div class="footer"></div>
    <script src="index.js"></script>
</body>
</html>
