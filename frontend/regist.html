<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#211914">
    <title>Create account | CINEFLIX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navbar"></div>
    <main class="auth-layout">
        <section class="auth-card" aria-labelledby="register-heading">
            <p class="eyebrow">Your seat is waiting</p>
            <h1 id="register-heading">Join the story</h1>
            <p class="auth-intro">Create an account and make this your movie night tradition.</p>
            <form id="registerForm">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" autocomplete="name" required>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required>
                <label for="age">Age <span class="optional-label">(optional)</span></label>
                <input id="age" name="age" type="number" min="1" max="120" inputmode="numeric">
                <p class="form-message" id="registerMessage" role="status" aria-live="polite"></p>
                <button class="submit button-primary" type="submit">Create account</button>
            </form>
            <p class="auth-footnote">Already have an account? <a href="login.html">Sign in</a></p>
        </section>
    </main>
    <div class="footer"></div>
    <script src="index.js"></script>
</body>
</html>
