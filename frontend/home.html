}
button{

    border: none;
    cursor: pointer;
}
.hero button:hover, .modal button:hover { background-color: #b9384a; }
.cat{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding: 10px 30px 35px;
}
.box1{
   grid-column: auto;
}
.box2{

}  
.box3{

.box4{

}

}

}
.box9{
     grid-column: auto;
  
}
.box1 img,.box2 img,.box3 img,.box4 img,.box5 img ,.box6 img , .box7 img, .box7 img,.box8 img,.box9 img{
    width: 100%;
    height: 170px;
    object-fit: cover;
    border-radius: 8px;
}
.box img:hover, .cat img:hover, .single:hover{
    transform: translateY(-4px);
    transition: 0.3s;
}
.single{
    background-color: white;
    width: 260px;

width: 100%;

margin-top: 100px;

display: flex;
