<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#211914">
    <title>Sign in | CINEFLIX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navbar"></div>
    <main class="auth-layout">
        <section class="auth-card" aria-labelledby="login-heading">
            <p class="eyebrow">Good to see you again</p>
            <h1 id="login-heading">Welcome back</h1>
            <p class="auth-intro">Sign in and pick up where your next story begins.</p>
            <form id="loginForm">
                <label for="loginName">Name</label>
                <input id="loginName" name="name" type="text" autocomplete="username" required>
                <label for="loginPassword">Password</label>
                <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
                <p class="form-message" id="loginMessage" role="status" aria-live="polite"></p>
                <button class="login-btn button-primary" type="submit">Sign in</button>
            </form>
            <p class="auth-footnote">New to CINEFLIX? <a href="regist.html">Create an account</a></p>
        </section>
    </main>
    <div class="footer"></div>
    <script src="index.js"></script>
</body>
</html>
